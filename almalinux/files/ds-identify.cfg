# Installed by hako. Keep cloud-init off for a boot with no datasource, as on
# the other hako boxes, whatever the packaged default policy: without a seed
# cloud-init only fails its units and writes a connection profile for the NIC. With a
# seed attached (config.vm.cloud_init, vagrant-qemu private networks) a
# datasource is found and cloud-init runs normally.
policy: search,found=all,maybe=all,notfound=disabled
