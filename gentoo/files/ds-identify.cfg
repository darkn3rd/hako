# Installed by hako. Gentoo's cloud-init enables itself when ds-identify finds
# no datasource (notfound=enabled); then every plain `vagrant up` runs
# cloud-init without a seed, fails four units and writes a network file for
# the NIC. Disable it for that boot instead, as Ubuntu's and Arch's do. With a
# seed attached (config.vm.cloud_init, vagrant-qemu private networks) a
# datasource is found and cloud-init runs normally.
policy: search,found=all,maybe=all,notfound=disabled
