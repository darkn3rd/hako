# Installed by hako.
# Only look for a NoCloud (or ConfigDrive) seed. With two entries ds-identify
# really searches; when no seed is attached (the normal `vagrant up`) it
# disables cloud-init for that boot, so cloud-init adds no boot time and
# writes no netplan file. When Vagrant attaches a seed (config.vm.cloud_init,
# or vagrant-qemu's private network), cloud-init runs normally.
datasource_list: [ NoCloud, ConfigDrive ]
